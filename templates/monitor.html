<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>IOT HMI - {{ model }}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}?v=ck3083-gap">
</head>
<body>

{% include "header.html" %}

<div class="meta">
  Auto refresh: <span id="refreshMs"></span> ms |
  Last update: <span id="lastUpdate">-</span> |
  DB: <span id="dbStatus" class="pill bad">?</span>
</div>

<div class="row">

  <div class="card">
    <div class="title">{{ model }}</div>
    {% if device == "ck3083" %}
    <div class="small">
      PT100 · Last DB write: <span id="tLastDb">-</span>
    </div>
    <table id="tTable"></table>
    {% else %}
    <div class="small">
      4–20 mA · Last DB write: <span id="iLastDb">-</span>
    </div>
    <div class="device-cols">
      <div>
        <div class="section-title">Currents</div>
        <table id="iTable"></table>
      </div>
      <div>
        <div class="section-title">Pressures</div>
        <table id="pTable"></table>
      </div>
    </div>
    {% endif %}
  </div>

</div>

<script>
const REFRESH_MS = {{ refresh_ms }};
</script>

<script src="{{ request.url_for('static', path='js/main.js') }}?v=ck-no-head"></script>

</body>
</html>
