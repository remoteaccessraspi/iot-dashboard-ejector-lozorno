# INVT GD20-EU na spoločnom Modbus RTU masteri.
# Setpoint ide cez Modbus 0x2002. Spätná väzba PID je vlastný analógový vstup meniča, nie P6.
invt_gd20:
  enabled: true
  slave_id: 100

  polling:
    # História GD20. Čítanie ide v cykle modbus.poll_period_s, nie vlastným intervalom.
    history_interval_s: 30

  pressure:
    unit: "kPa"
    min_kpa: 0
    max_kpa: 1500
    signal_min_ma: 4
    signal_max_ma: 20
    feedback_input: "AI2"
    feedback_min_percent: 0
    feedback_max_percent: 100
    # Prúdový AI GD20 reportuje v 0x300C/0x300D ako ekvivalent 0–10 V pre 0–20 mA.
    # V = raw * scale, mA = V / 10 * 20, potom 4–20 mA -> min_kpa..max_kpa.
    ai_report_min_v: 0
    ai_report_max_v: 10
    ai_report_min_ma: 0
    ai_report_max_ma: 20

  pid_defaults:
    # GD20 používa Kp, Ti, Td. Factory defaults podľa manuálu GD20-EU.
    # Pri štarte sa do meniča nezapisujú, aktuálny stav VFD má prednosť.
    kp: 1.00
    ti_s: 0.10
    td_s: 0.00

  # Čerstvosť vzorky pre rozhodnutie EM2RS. Pásmo, kedy EM2RS smie regulovať,
  # je em2rs_556.valve.p7_trim.invt_tolerance_kpa.
  stability:
    max_age_s: 10

  commands:

    control:
      alias: "control_command"
      address: 0x2000
      access: "write"
      values:
        run_forward: 0x0001
        run_reverse: 0x0002
        stop: 0x0005
        coast_stop: 0x0006
        fault_reset: 0x0007

    pid_reference:
      alias: "pid_reference_command"
      address: 0x2002
      access: "read_write"
      raw_min: 0
      raw_max: 1000
      scale: 0.1
      unit: "%"
      engineering_unit: "kPa"
      engineering_min: 0
      engineering_max: 1500

    pid_feedback_command:
      alias: "pid_feedback_command"
      address: 0x2003
      access: "read_write"
      raw_min: 0
      raw_max: 1000
      scale: 0.1
      unit: "%"
      enabled: false

  monitoring:

    # Stavové slovo Goodrive série. Leží mimo bloku 0x3000, číta sa samostatne.
    # Chod je len running_values. Nulová frekvencia pri RUN nie je STOP.
    # Keď sa slovo neprečíta, posledný running a status_code ostanú.
    status_word:
      alias: "status_code"
      address: 0x2100
      access: "read"
      scale: 1
      running_values: [1, 2]
      values:
        1: "RUN FWD"
        2: "RUN REV"
        3: "STOP"
        4: "FAULT"
        5: "POFF"
        6: "PRE-EXCITING"

    running_frequency:
      alias: "frequency_actual_hz"
      address: 0x3000
      access: "read"
      scale: 0.01
      unit: "Hz"

    set_frequency:
      alias: "frequency_set_hz"
      address: 0x3001
      access: "read"
      scale: 0.01
      unit: "Hz"

    dc_bus_voltage:
      alias: "dc_bus_voltage_v"
      address: 0x3002
      access: "read"
      scale: 0.1
      unit: "V"

    output_voltage:
      alias: "output_voltage_v"
      address: 0x3003
      access: "read"
      scale: 1.0
      unit: "V"

    output_current:
      alias: "output_current_a"
      address: 0x3004
      access: "read"
      scale: 0.1
      unit: "A"

    motor_speed:
      alias: "NA"
      address: 0x3005
      access: "read"
      scale: 1
      unit: "rpm"

    output_power:
      alias: "output_power_percent"
      address: 0x3006
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"

    output_torque:
      alias: "output_torque_percent"
      address: 0x3007
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"

    pid_setting:
      alias: "pid_setpoint_percent"
      address: 0x3008
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"
      engineering_alias: "pid_setpoint_kpa"
      engineering_unit: "kPa"

    pid_feedback:
      alias: "pid_feedback_percent"
      address: 0x3009
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"
      engineering_alias: "pid_feedback_kpa"
      engineering_unit: "kPa"

    digital_input_state:
      alias: "digital_input_state"
      address: 0x300A
      access: "read"
      scale: 1

    ai1:
      alias: "ai1_value"
      address: 0x300C
      access: "read"
      scale: 0.01

    ai2:
      alias: "ai2_value"
      address: 0x300D
      access: "read"
      scale: 0.01
      unit: "V"

    fault_code:
      alias: "fault_code"
      address: 0x5000
      access: "read"
      scale: 1

  parameters:

    run_command_source:
      alias: "run_command_source"
      parameter: "P00.01"
      address: 0x0001
      access: "read_write"
      required_value: 2

    max_frequency:
      alias: "max_frequency_hz"
      parameter: "P00.03"
      address: 0x0003
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    upper_frequency_limit:
      alias: "upper_frequency_limit_hz"
      parameter: "P00.04"
      address: 0x0004
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    lower_frequency_limit:
      alias: "lower_frequency_limit_hz"
      parameter: "P00.05"
      address: 0x0005
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    frequency_source_a:
      alias: "frequency_source_a"
      parameter: "P00.06"
      address: 0x0006
      access: "read_write"
      required_value: 7

    acceleration_time:
      alias: "acceleration_time_s"
      parameter: "P00.11"
      address: 0x000B
      access: "read_write"
      scale: 0.1
      unit: "s"

    deceleration_time:
      alias: "deceleration_time_s"
      parameter: "P00.12"
      address: 0x000C
      access: "read_write"
      scale: 0.1
      unit: "s"

    pid_reference_source:
      alias: "pid_reference_source"
      parameter: "P09.00"
      address: 0x0900
      access: "read_write"
      required_value: 6

    pid_feedback_source:
      alias: "pid_feedback_source"
      parameter: "P09.02"
      address: 0x0902
      access: "read_write"
      required_value: 1

    pid_direction:
      alias: "pid_direction"
      parameter: "P09.03"
      address: 0x0903
      access: "read_write"

    pid_kp:
      alias: "pid_kp"
      parameter: "P09.04"
      address: 0x0904
      access: "read_write"
      scale: 0.01
      min: 0.00
      max: 100.00
      default: 1.00

    pid_ti:
      alias: "pid_ti_s"
      parameter: "P09.05"
      address: 0x0905
      access: "read_write"
      scale: 0.01
      unit: "s"
      min: 0.00
      max: 10.00
      default: 0.10

    pid_td:
      alias: "pid_td_s"
      parameter: "P09.06"
      address: 0x0906
      access: "read_write"
      scale: 0.01
      unit: "s"
      min: 0.00
      max: 10.00
      default: 0.00

    modbus_address:
      alias: "modbus_slave_id"
      parameter: "P14.00"
      address: 0x0E00
      access: "read_write"

    modbus_baudrate:
      alias: "modbus_baudrate_code"
      parameter: "P14.01"
      address: 0x0E01
      access: "read_write"
      required_value: 3

    modbus_format:
      alias: "modbus_format_code"
      parameter: "P14.02"
      address: 0x0E02
      access: "read_write"
      required_value: 0

    communication_timeout:
      alias: "communication_timeout_s"
      parameter: "P14.04"
      address: 0x0E04
      access: "read_write"
      scale: 0.1
      unit: "s"
