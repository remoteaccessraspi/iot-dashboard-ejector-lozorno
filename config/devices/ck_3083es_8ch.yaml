ck_3083es_8ch:
  alias: "CK-3083ES_8CH"
  # Štart chce t_gen_in aspoň ready_min + ready_hyst a t_cond_in pod ready_max - ready_hyst, súvisle hold_s.
  # t_gen_in pod ready_min - ready_hyst, t_cond_in nad ready_max + ready_hyst
  # a t_evap_in pod ready_min - ready_hyst zastavia bežiaci menič až po stop_hold_s.
  # Keď menič v bežnom RUN reguluje v pásme (gd20 stable), t_cond_in berie
  # ready_max_stable + ready_hyst namiesto ready_max + ready_hyst. Servis teplotný STOP obchádza.
  # Pásmo t_evap_in okolo ready_min drží posledný stav. Obnova chce teplotu nad ready_min + ready_hyst súvisle hold_s.
  start:
    hold_s: 120
    stop_hold_s: 15

modbus:
  slaves:
    "CK-3083ES_8CH": 2

  registers:
    "CK-3083ES_8CH":
      function: holding_registers
      address: 2
      count: 8
      scale: 0.1
      signed: true

#
# ------------------------
# KONVERZNÉ KANÁLY
# ------------------------
# Dočasné aliasy = názov kanála (zapojenie ešte nie je definitívne).
# Neskôr nahraď name popisným textom, napr. "Teplota generátora".
channels:

  # --- Teploty ---
  t1: { name: "t_evap_in", unit: "°C", ready_min: 18, ready_hyst: 1 }
  t2: { name: "t_gen_out", unit: "°C" }
  t3: { name: "t_gen_in", unit: "°C", ready_min: 80, ready_hyst: 1 }
  t4: { name: "t_control", unit: "°C" }
  t5: { name: "t_cond_out", unit: "°C" }
  # ready_max: štart pod 27, stop nad 29 keď menič nie je stabilný.
  # ready_max_stable: pri stabilnom INVT stop až nad 31. Chýbajúci kľúč = len ready_max.
  t6: { name: "t_cond_in", unit: "°C", ready_max: 28, ready_hyst: 1, ready_max_stable: 30 }
  t7: { name: "t_evap_out", unit: "°C" }
  t8: { name: "NA", unit: "°C" }
