modbus: 
  method: rtu
  #port: /dev/ttyUSB0
  port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
  baudrate: 9600
  parity: N
  stopbits: 1
  timeout_sec: 0.55
  # Spoločná perióda jedného poll cyklu (rovnaký timestamp pre všetky zariadenia).
  poll_period_s: 5

  slaves:
    temperature_slave_id: 2
    current_slave_id: 3

  registers:
    temperature:
      function: holding_registers
      address: 2
      count: 8
      scale: 0.1
      signed: true

    current_loop:
      function: holding_registers
      address: 96      # overené v prevádzke, nemeniť bez merania na module
      count: 8
      scale: 0.001
      signed: false
# user a password sú v config/secrets.yaml, ktorý nie je verzovaný.
# Vzor je v config/secrets.yaml.example. Prepísať ich vie aj prostredie
# cez EJECTOR_DB_USER a EJECTOR_DB_PASSWORD.
database:
  host: 127.0.0.1
  port: 3306
  name: ejector

# conversion robí CurrentLoopDevice — samostatný converter vypnutý (inak duplicitné riadky)
features:
  converter: false

hmi:
  refresh_ms: 2000

#
# ------------------------
# KONVERZNÉ KANÁLY
# ------------------------
# Dočasné aliasy = názov kanála (zapojenie ešte nie je definitívne).
# Neskôr nahraď name popisným textom, napr. "Teplota generátora".
channels:

  # --- Teploty ---
  t1: { name: "t_evap_in", unit: "°C" }
  t2: { name: "t_gen_out", unit: "°C" }
  t3: { name: "t_gen_in", unit: "°C" }
  t4: { name: "t_control", unit: "°C" }
  t5: { name: "t_cond_out", unit: "°C" }
  t6: { name: "t_cond_in", unit: "°C" }
  t7: { name: "t_evap_out", unit: "°C" }
  t8: { name: "NA", unit: "°C" }

  # --- Tlaky (z i1–i8 cez conversion) ---
  p1: { name: "NA", unit: "kPa" }
  p2: { name: "NA", unit: "kPa" }
  p3: { name: "NA", unit: "kPa" }
  p4: { name: "NA", unit: "kPa" }
  p5: { name: "NA", unit: "kPa" }
  p6: { name: "p_gen_prim", unit: "kPa (0-1500)" }
  p7: { name: "p_evap_prim", unit: "kPa (0-220)" }
  p8: { name: "p_cond_prim", unit: "kPa (0-400)" }


  # --- Prúdy 4–20 mA ---
  i1: { name: "NA", unit: "mA" }
  i2: { name: "NA", unit: "mA" }
  i3: { name: "NA", unit: "mA" }
  i4: { name: "NA", unit: "mA" }
  i5: { name: "NA", unit: "mA" }
  i6: { name: "p_gen_prim", unit: "mA (4-20)" }
  i7: { name: "p_evap_prim", unit: "mA (4-20)" }
  i8: { name: "p_cond_prim", unit: "mA (4-20)" }

conversion:
  interval_sec: 1
  # a = kPa pri 4 mA, b = kPa pri 20 mA
  # p = a + (i - 4) * (b - a) / 16
  channels:
    # p1–p5 nemajú pripojený snímač. a/b sú zástupné hodnoty, ktoré len
    # prepíšu mA na seba samé; pri zapojení snímača nastav skutočný rozsah.
    p1: { source: i1, a: 4.0, b: 20.0 }
    p2: { source: i2, a: 4.0, b: 20.0 }
    p3: { source: i3, a: 4.0, b: 20.0 }
    p4: { source: i4, a: 4.0, b: 20.0 }
    p5: { source: i5, a: 4.0, b: 20.0 }
    p6: { source: i6, a: 0, b: 1500.0 }
    p7: { source: i7, a: 0, b: 220.0 }
    p8: { source: i8, a: 0, b: 400.0 } 

# INVT GD20-EU na spoločnom Modbus RTU masteri.
# Setpoint ide cez Modbus 0x2002. Spätná väzba PID je vlastný analógový vstup meniča, nie P6.
invt_gd20:
  enabled: true
  slave_id: 100

  polling:
    # História GD20. Čítanie ide v cykle modbus.poll_period_s, nie vlastným intervalom.
    history_interval_s: 30

  pressure:
    unit: "kPa"
    min_kpa: 0
    max_kpa: 1500
    signal_min_ma: 4
    signal_max_ma: 20
    feedback_input: "AI2"
    feedback_min_percent: 0
    feedback_max_percent: 100
    # Prúdový AI GD20 reportuje v 0x300C/0x300D ako ekvivalent 0–10 V pre 0–20 mA.
    # V = raw * scale, mA = V / 10 * 20, potom 4–20 mA -> min_kpa..max_kpa.
    ai_report_min_v: 0
    ai_report_max_v: 10
    ai_report_min_ma: 0
    ai_report_max_ma: 20

  pid_defaults:
    # GD20 používa Kp, Ti, Td. Factory defaults podľa manuálu GD20-EU.
    # Pri štarte sa do meniča nezapisujú, aktuálny stav VFD má prednosť.
    kp: 1.00
    ti_s: 0.10
    td_s: 0.00

  commands:

    control:
      alias: "control_command"
      address: 0x2000
      access: "write"
      values:
        run_forward: 0x0001
        run_reverse: 0x0002
        stop: 0x0005
        coast_stop: 0x0006
        fault_reset: 0x0007

    pid_reference:
      alias: "pid_reference_command"
      address: 0x2002
      access: "read_write"
      raw_min: 0
      raw_max: 1000
      scale: 0.1
      unit: "%"
      engineering_unit: "kPa"
      engineering_min: 0
      engineering_max: 1500

    pid_feedback_command:
      alias: "pid_feedback_command"
      address: 0x2003
      access: "read_write"
      raw_min: 0
      raw_max: 1000
      scale: 0.1
      unit: "%"
      enabled: false

  monitoring:

    # Stavové slovo Goodrive série. Leží mimo bloku 0x3000, číta sa samostatne.
    # Bez neho sa chod odvodzuje z frekvencie, čo pri nulovom výstupe PID
    # hlási STOP aj vtedy, keď menič RUN povel prijal.
    status_word:
      alias: "status_code"
      address: 0x2100
      access: "read"
      scale: 1
      running_values: [1, 2]
      values:
        1: "RUN FWD"
        2: "RUN REV"
        3: "STOP"
        4: "FAULT"
        5: "POFF"
        6: "PRE-EXCITING"

    running_frequency:
      alias: "frequency_actual_hz"
      address: 0x3000
      access: "read"
      scale: 0.01
      unit: "Hz"

    set_frequency:
      alias: "frequency_set_hz"
      address: 0x3001
      access: "read"
      scale: 0.01
      unit: "Hz"

    dc_bus_voltage:
      alias: "dc_bus_voltage_v"
      address: 0x3002
      access: "read"
      scale: 0.1
      unit: "V"

    output_voltage:
      alias: "output_voltage_v"
      address: 0x3003
      access: "read"
      scale: 1.0
      unit: "V"

    output_current:
      alias: "output_current_a"
      address: 0x3004
      access: "read"
      scale: 0.1
      unit: "A"

    motor_speed:
      alias: "motor_speed_rpm"
      address: 0x3005
      access: "read"
      scale: 1
      unit: "rpm"

    output_power:
      alias: "output_power_percent"
      address: 0x3006
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"

    output_torque:
      alias: "output_torque_percent"
      address: 0x3007
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"

    pid_setting:
      alias: "pid_setpoint_percent"
      address: 0x3008
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"
      engineering_alias: "pid_setpoint_kpa"
      engineering_unit: "kPa"

    pid_feedback:
      alias: "pid_feedback_percent"
      address: 0x3009
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"
      engineering_alias: "pid_feedback_kpa"
      engineering_unit: "kPa"

    digital_input_state:
      alias: "digital_input_state"
      address: 0x300A
      access: "read"
      scale: 1

    ai1:
      alias: "ai1_value"
      address: 0x300C
      access: "read"
      scale: 0.01

    ai2:
      alias: "ai2_value"
      address: 0x300D
      access: "read"
      scale: 0.01
      unit: "V"

    fault_code:
      alias: "fault_code"
      address: 0x5000
      access: "read"
      scale: 1

  parameters:

    run_command_source:
      alias: "run_command_source"
      parameter: "P00.01"
      address: 0x0001
      access: "read_write"
      required_value: 2

    max_frequency:
      alias: "max_frequency_hz"
      parameter: "P00.03"
      address: 0x0003
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    upper_frequency_limit:
      alias: "upper_frequency_limit_hz"
      parameter: "P00.04"
      address: 0x0004
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    lower_frequency_limit:
      alias: "lower_frequency_limit_hz"
      parameter: "P00.05"
      address: 0x0005
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    frequency_source_a:
      alias: "frequency_source_a"
      parameter: "P00.06"
      address: 0x0006
      access: "read_write"
      required_value: 7

    acceleration_time:
      alias: "acceleration_time_s"
      parameter: "P00.11"
      address: 0x000B
      access: "read_write"
      scale: 0.1
      unit: "s"

    deceleration_time:
      alias: "deceleration_time_s"
      parameter: "P00.12"
      address: 0x000C
      access: "read_write"
      scale: 0.1
      unit: "s"

    pid_reference_source:
      alias: "pid_reference_source"
      parameter: "P09.00"
      address: 0x0900
      access: "read_write"
      required_value: 6

    pid_feedback_source:
      alias: "pid_feedback_source"
      parameter: "P09.02"
      address: 0x0902
      access: "read_write"
      required_value: 1

    pid_direction:
      alias: "pid_direction"
      parameter: "P09.03"
      address: 0x0903
      access: "read_write"

    pid_kp:
      alias: "pid_kp"
      parameter: "P09.04"
      address: 0x0904
      access: "read_write"
      scale: 0.01
      min: 0.00
      max: 100.00
      default: 1.00

    pid_ti:
      alias: "pid_ti_s"
      parameter: "P09.05"
      address: 0x0905
      access: "read_write"
      scale: 0.01
      unit: "s"
      min: 0.00
      max: 10.00
      default: 0.10

    pid_td:
      alias: "pid_td_s"
      parameter: "P09.06"
      address: 0x0906
      access: "read_write"
      scale: 0.01
      unit: "s"
      min: 0.00
      max: 10.00
      default: 0.00

    modbus_address:
      alias: "modbus_slave_id"
      parameter: "P14.00"
      address: 0x0E00
      access: "read_write"

    modbus_baudrate:
      alias: "modbus_baudrate_code"
      parameter: "P14.01"
      address: 0x0E01
      access: "read_write"
      required_value: 3

    modbus_format:
      alias: "modbus_format_code"
      parameter: "P14.02"
      address: 0x0E02
      access: "read_write"
      required_value: 0

    communication_timeout:
      alias: "communication_timeout_s"
      parameter: "P14.04"
      address: 0x0E04
      access: "read_write"
      scale: 0.1
      unit: "s"

em2rs_556:
  enabled: true
  slave_id: 31
  polling:
    # Nie je časovač. Čítanie aj zápis idú v cykle modbus.poll_period_s.
    interval_s: 5
  safety:
    # Cieľ je 200 pulzov na otáčku. Driver má teraz slovo 600, preto prevod ešte nie je platný.
    scaling_confirmed: false
    # HMI Manual smie poslať homing a polohu. Štart mastera pohyb sám nespúšťa.
    motion_writes_enabled: true
  manual:
    # 600 pulzov = 3 otáčky pri 200 pulzoch na otáčku, celý pracovný zdvih.
    # Prevod na driver units je vypnutý, kým scaling_confirmed nie je true.
    max_steps: 600
  startup_check:
    # Etapa 4 z tohto bloku skladá len offline plán. Živé čítanie Slave 31 je etapa 8.
    # iot-master pri štarte raz zapíše expected slová, ktoré sa líšia od drivera.
    # Poll potom tieto registre len číta. 0x6002 a EEPROM sa nezapisujú.
    # policy:
    #   check_only             poll len porovnáva
    #   write_after_approval   zápis až po ďalšom schválení; teraz sa nepoužíva
    # expected: null znamená „nemáme potvrdenú cieľovú hodnotu“, nie zhodu s 0.
    # Planner z toho nesmie urobiť MATCH ani CONFIG_MATCH.
    # Úspešné čítanie bez cieľa je MANUAL_APPROVAL_REQUIRED a stav ostáva CONFIG_NOT_CHECKED.
    parameters:
      pulse_per_revolution:
        parameter: "Pr0.00"
        register: pulse_per_revolution
        policy: check_only
        expected: 200
      # Pr5.00 má scale 0.1 A, takže slovo 8 je 0.8 A.
      peak_current:
        parameter: "Pr5.00"
        register: peak_current
        policy: check_only
        expected: 8
      # 0x0001: bity 0–3 = 1 (poloha), bit 6 = 0 (absolútna poloha).
      path0_mode:
        parameter: "Path0.mode"
        register: path0_mode
        policy: check_only
        expected: 1
      # Path0.speed je priamo v rpm, bez scale.
      path0_speed:
        parameter: "Path0.speed"
        register: speed
        policy: check_only
        expected: 50
      path0_acceleration:
        parameter: "Path0.acceleration"
        register: acceleration
        policy: check_only
        expected: 100
      path0_deceleration:
        parameter: "Path0.deceleration"
        register: deceleration
        policy: check_only
        expected: 100
      # Pauza po Path 0. Jednotka v manuáli V1.5 nie je uvedená; cieľové slovo je 0.
      path0_pause_time:
        parameter: "Path0.pause"
        register: pause_time
        policy: check_only
        expected: 0
  valve:
    pulses_per_revolution: 200
    full_travel_steps: 600
    full_travel_revolutions: 3
    # Homing ide do mechanického konca bez koncových spínačov.
    # Motor záťaž na konci znesie a pulzy ďalej dostáva.
    # 650 pulzov BACKWARD je samostatný homing, nie bežný povel v rozsahu 0..600.
    homing_steps: 650
    homing_direction: CLOSE
    homing_limit_switches: false
    homing_method: stall_at_end
    homing_pulses_continue_at_end: true
    # Dokončený príkaz backward 650 je len predpokladaná logická nula.
    # full_travel_steps je prevádzkový rozsah. Samostatný kľúč travel_steps sa nepridáva.
    reference_method: FIXED_STEPS_ASSUMED
    # Otvorenie ETS 12C zvyšuje p_evap_prim. Tlak CLOSED závisí od prevádzky a teploty.
    # null nie je vypnutá ochrana, kým je tlaková kontrola zapnutá.
    # enabled ostáva pôvodný bezpečnostný kľúč. Vypnutie tlaku je closed_pressure_check_enabled.
    # Okná 15/5/15 s sa používajú len pri zapnutej kontrole. Najnovšia vzorka musí byť do 10 s.
    # PID active sa nevyžaduje. 100 kPa nie je predvolený limit.
    # validated false: smer tlaku potvrdila obsluha, snímač a vplyv čerpadla nie.
    pressure_interlock:
      enabled: true
      closed_pressure_check_enabled: false
      validated: false
      # Zadanie 26 volá tento kľúč closed_pressure_source. Samostatný kľúč sa nepridáva.
      source: conversion_table.p7
      max_closed_pressure_kpa: null
      require_gd20_running: true
      require_gd20_pid_active: false
      pid_active_source: null
      regulated_pressure_source: conversion_table.p6
      regulated_setpoint_source: control_state.gd20_setpoint_kpa
      setpoint_tolerance_kpa: null
      setpoint_stable_time_s: 15.0
      pressure_settle_time_s: 5.0
      stable_time_s: 15.0
      max_data_age_s: 10.0
      require_mechanical_closed_confirmation: true
    min_position_steps: 0
    max_position_steps: 600
    min_position_percent: 0.0
    max_position_percent: 100.0
    # Dorovnanie p7 zdvihom ETS 12C. Vzorka p7 raz za modbus.poll_period_s.
    # Beh len keď enabled je true a setpoint_kpa je číslo.
    # n = round((setpoint_kpa - p7) / k_kpa_per_step), orez na 0..600.
    # Kladné n otvára a p7 stúpa. Po pohybe sa čaká settle_wait, potom
    # sa krok delí na polovicu, kým |chyba| >= stop_band_kpa.
    # Z pokoja nový beh až keď |chyba| >= sensitivity_kpa po confirm_samples.
    p7_trim:
      enabled: false
      setpoint_kpa: null
      k_kpa_per_step: 0.18
      sensitivity_kpa: 5
      stop_band_kpa: 1
      confirm_samples: 3
      settle_wait:
        - { max_steps: 15, wait_s: 30 }
        - { max_steps: 35, wait_s: 70 }
        - { max_steps: 70, wait_s: 90 }
        - { max_steps: 130, wait_s: 130 }
      settle_extra_per_10_steps_s: 5
      settle_span_kpa: 1
      settle_span_samples: 3
      settle_extra_s: 60
      no_response_kpa: 1
  motion:
    default_speed_rpm: 50
    acceleration: 100
    deceleration: 100
  modbus:
    registers:
      # Ciele sú v startup_check: Pr0.00=200, Pr5.00=8. scaling_confirmed ostáva false, kým živé čítanie nesedí.
      pulse_per_revolution:
        parameter: "Pr0.00"
        address: 0x0001
        unit: "P/R"
        range_min: 200
        range_max: 51200

      # Pr6.16. V1.5 gives the raw word only; it is not a decoded version string.
      firmware:
        parameter: "Pr6.16"
        address: 0x0201
        read_only: true

      peak_current:
        parameter: "Pr5.00"
        address: 0x0191
        scale: 0.1
        unit: "A"

      # Pr0.07. 1 drží motor bez ohľadu na DI. Po pohybe sa zapisuje 0.
      forced_enable:
        parameter: "Pr0.07"
        address: 0x000F

      # Pr4.02. Továreň má 0x88, enable so zatvoreným DI1, a hriadeľ drží prúd.
      # 0 znamená neplatný vstup, enable potom riadi len Pr0.07.
      si1:
        parameter: "Pr4.02"
        address: 0x0145

      # PR global/control
      pr_global_control:
        address: 0x6000

      command:
        address: 0x6002

      # Soft limits
      soft_limit_positive_high:
        address: 0x6006
      soft_limit_positive_low:
        address: 0x6007
      soft_limit_negative_high:
        address: 0x6008
      soft_limit_negative_low:
        address: 0x6009

      # Homing
      homing_mode:
        address: 0x600A
      homing_high_velocity:
        address: 0x600F
      homing_low_velocity:
        address: 0x6010
      homing_acceleration:
        address: 0x6011
      homing_deceleration:
        address: 0x6012
      homing_overtravel:
        address: 0x6015

      # Stop / diagnostics
      quick_stop_time:
        address: 0x6017
      pr_alarm:
        address: 0x601D
      motion_status:
        address: 0x1003
        read_only: true
      current_alarm:
        address: 0x2203
        read_only: true

      # Position feedback – READ ONLY
      profile_position_high:
        address: 0x602A
        read_only: true
      profile_position_low:
        address: 0x602B
        read_only: true

      actual_position_high:
        address: 0x602C
        read_only: true
      actual_position_low:
        address: 0x602D
        read_only: true

      # PR Path 0
      path0_mode:
        address: 0x6200
      target_position_high:
        address: 0x6201
      target_position_low:
        address: 0x6202
      speed:
        address: 0x6203
      acceleration:
        address: 0x6204
      deceleration:
        address: 0x6205
      pause_time:
        address: 0x6206

    commands:
      start_path_0: 0x0010
      homing: 0x0020
      set_current_position_zero: 0x0021
      quick_stop: 0x0040
