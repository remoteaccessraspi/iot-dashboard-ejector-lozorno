modbus: 
  method: rtu
  #port: /dev/ttyUSB0
  port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
  baudrate: 9600
  parity: N
  stopbits: 1
  timeout_sec: 0.55

  slaves:
    temperature_slave_id: 2
    current_slave_id: 3
    opta_slave_id: 1
    waveshare_relay_slave_id: 4

  registers:
    temperature:
      function: holding_registers
      address: 2
      count: 8
      scale: 0.1
      signed: true

    current_loop:
      function: holding_registers
      address: 96      # ⚠ toto môže byť 8, 16 alebo iné – podľa manuálu
      count: 8
      scale: 0.001
      signed: false
database:
  host: 127.0.0.1
  port: 3306
  user: dbapp
  password: admin
  name: ejector

# Opta / PWM-PID na Lozorne nie je pripojená
# conversion robí CurrentLoopDevice — samostatný converter vypnutý (inak duplicitné riadky)
# Waveshare relé modul na zbernici zatiaľ neodpovedá
features:
  opta: false
  converter: false
  waveshare: false

hmi:
  refresh_ms: 2000
  control_enabled: false

#
# ------------------------
# KONVERZNÉ KANÁLY
# ------------------------
# Dočasné aliasy = názov kanála (zapojenie ešte nie je definitívne).
# Neskôr nahraď name popisným textom, napr. "Teplota generátora".
channels:

  # --- Teploty ---
  t1: { name: "t1", unit: "°C" }
  t2: { name: "t2", unit: "°C" }
  t3: { name: "t3", unit: "°C" }
  t4: { name: "t4", unit: "°C" }
  t5: { name: "t5", unit: "°C" }
  t6: { name: "t6", unit: "°C" }
  t7: { name: "t7", unit: "°C" }
  t8: { name: "t8", unit: "°C" }

  # --- Tlaky (z i1–i8 cez conversion) ---
  p1: { name: "p1", unit: "kPa" }
  p2: { name: "p2", unit: "kPa" }
  p3: { name: "p3", unit: "kPa" }
  p4: { name: "p4", unit: "kPa" }
  p5: { name: "p5", unit: "kPa" }
  p6: { name: "p6", unit: "kPa" }
  p7: { name: "p7", unit: "kPa" }
  p8: { name: "p8", unit: "kPa" }

  # --- Prúdy 4–20 mA ---
  i1: { name: "i1", unit: "mA" }
  i2: { name: "i2", unit: "mA" }
  i3: { name: "i3", unit: "mA" }
  i4: { name: "i4", unit: "mA" }
  i5: { name: "i5", unit: "mA" }
  i6: { name: "i6", unit: "mA" }
  i7: { name: "i7", unit: "mA" }
  i8: { name: "i8", unit: "mA" }

conversion:
  interval_sec: 1
  # a = kPa pri 4 mA, b = kPa pri 20 mA
  # p = a + (i - 4) * (b - a) / 16
  channels:
    p1: { source: i1, a: 4.0, b: 20.0 }
    p2: { source: i2, a: 4.0, b: 20.0 }
    p3: { source: i3, a: 4.0, b: 20.0 }
    p4: { source: i4, a: 4.0, b: 20.0 }
    p5: { source: i5, a: 4.0, b: 20.0 }
    p6: { source: i6, a: 4.0, b: 20.0 }
    p7: { source: i7, a: 4.0, b: 20.0 }
    p8: { source: i8, a: 4.0, b: 20.0 } 

# ------------------------
# RELÉ
# ------------------------
relay:
  count: 8
  default_state: 0
  # Dočasné aliasy (zapojenie ešte nie je definitívne)
  names:
    r1: "re1"
    r2: "re2"
    r3: "re3"
    r4: "re4"
    r5: "re5"
    r6: "re6"
    r7: "re7"
    r8: "re8"
     # ----------------------------------------
  # RIADENIE RELÉ
  # ----------------------------------------


  control:

    # ---- R1 AUTO ----
    r1:
      mode: manual
      logic: OR
      

      rules:

        # pravidlo 1 (AND podmienky)
        - time:
            from: "06:00"
            to:   "21:00"
          conditions:
            - { source: t3, min: 66, max: 100, hyst: 2.5 }


    # ---- R2 MANUAL ----
    r2:
      mode: manual

    r3:
      mode: manual

    r4:
      mode: manual
 

    r5:
      mode: manual

    r6:
      mode: manual
      logic: OR
      

      rules:

        # pravidlo 1 (AND podmienky)
        - time:
            from: "06:00"
            to:   "21:00"
          conditions:
            - { source: p5, min: 266.805, max: 10000, hyst: 23.513 }

    r7:
      mode: manual
      logic: OR
      

      rules:

        # pravidlo 1 (AND podmienky)
        - time:
            from: "06:00"
            to:   "21:00"
          conditions:
            - { source: t3, min: 66, max: 100, hyst: 2.5 }

    r8:
      mode: manual
# ------------------------
# PWM
# ------------------------
pwm:
  period:
    default: 6000
    min: 100
    max: 10000
    step: 100
    unit: "ms"

  duty:
    default: 12.8
    min: 0
    max: 100
    step: 0.1
    unit: "%"

# ------------------------
# PID
# ------------------------
pid:
  t_set:
    default: 1.0
    min: 0.0
    max: 100.0
    step: 0.1

  t_full:
    default: 0.1
    min: 0.0
    max: 10.0
    step: 0.01

  t_move:
    default: 0.01
    min: 0.0
    max: 10.0
    step: 0.01

# ============================================================
# PLC APLIKÁCIA – KOMPLETNÁ DOKUMENTÁCIA KONFIGURÁCIE
# ============================================================


# ============================================================
# 1. ARCHITEKTÚRA SYSTÉMU
# ============================================================
# Systém pozostáva z:
# • Modbus RTU komunikácie
# • Databázy (MariaDB)
# • Konverzie 4–20 mA → fyzikálne veličiny
# • Relay rule engine s časovými pravidlami
# • PWM riadenia
# • PID regulátora
# • Web aplikácie (app.py)
#
# Bezpečnostná logika (enable väzby) je pevne definovaná v kóde.
# YAML slúži iba na konfiguráciu.


# ============================================================
# 2. MODBUS KONFIGURÁCIA
# ============================================================
# modbus:
#   method: rtu
#   port: /dev/serial/by-id/...
#   baudrate: 19200
#   parity: N
#   stopbits: 1
#   timeout_sec: 1
#
# Slaves:
#   temperature_slave_id: 2
#   current_slave_id: 3
#   opta_slave_id: 1
#
# Register map:
# temperature:
#   function: holding_registers
#   address: 2
#   count: 8
#   signed: true
#
# current_loop:
#   function: holding_registers
#   address: 96
#   count: 8
#   signed: false
#
# Význam:
# • function = typ Modbus funkcie
# • address = počiatočná adresa
# • count = počet registrov
# • signed = či je hodnota so znamienkom


# ============================================================
# 3. KONVERZNÉ KANÁLY (4–20 mA)
# ============================================================
# Prúd sa ukladá do databázy už v mA.
# Príklad:
#   4000 → 4.000 mA
#
# scale sa nepoužíva.
#
# Definícia:
#   p1: { source: i1, a: 0.0, b: 100000.0 }
#
# a = hodnota pri 4 mA
# b = hodnota pri 20 mA
#
# Extrapolácia NIE JE POVOLENÁ.
#
# Clampovanie:
#   ak i < 4.0  → i = 4.0
#   ak i > 20.0 → i = 20.0
#
# Výpočet:
#   p = a + (i - 4.0) * (b - a) / 16.0
#
# 16 = (20 - 4)
#
# Systém nikdy negeneruje hodnoty mimo fyzikálneho rozsahu.


# ============================================================
# 4. RELAY SEKČIA – ZÁKLADY
# ============================================================
# relay:
#   count: 8
#   default_state: 0
#
# names:
#   r1: "Enable PWM (FIXED)"
#   r2: "Enable PID (FIXED)"
#   r3: "Valve 1"
#   r4: "Heater"
#   r5: "Spare 1"
#   r6: "Spare 2"
#   r7: "Spare 3"
#   r8: "Spare 4"
#
# count = počet relé
# default_state = stav po štarte (0 vypnuté, 1 zapnuté)


# ============================================================
# 5. FIXNÉ RELÉ – ENABLE MAP
# ============================================================
# r1 = ENABLE PWM
# r2 = ENABLE PID
#
# Tieto väzby sú pevne definované v kóde.
# YAML ich nesmie meniť.
#
# Ak:
#   r1 = 0 → PWM je blokované
#   r2 = 0 → PID je blokované
#
# Aj keď ostatné podmienky platia.


# ============================================================
# 6. RELAY – MODE A LOGIC
# ============================================================
# mode:
#   manual → riadi obsluha
#   auto   → riadi rule engine
#
# logic:
#   OR  → stačí splnenie jedného rule
#   AND → musia byť splnené všetky rule


# ============================================================
# 7. RELAY – PRAVIDLÁ (RULES)
# ============================================================
# Štruktúra:
#
# rules:
#   - time:
#       from: "HH:MM"
#       to:   "HH:MM"
#     conditions:
#       - { source: X, min: A, max: B, hyst: H }
#
# Každé rule MUSÍ mať časový blok.


# ============================================================
# 8. ČASOVÉ OBMEDZENIE
# ============================================================
# Formát času:
#   HH:MM (24 hodinový formát)
#   vždy dvojmiestne (06:00, nie 6:00)
#
# Príklady:
#   06:00 → 18:00
#   22:00 → 04:00 (cez polnoc)
#   00:00 → 24:00 (celý deň)
#
# 24:00 = 1440 minút od polnoci
#
# Vyhodnotenie:
#   minúty = HH * 60 + MM
#
# Interval bez polnoci:
#   from ≤ now < to
#
# Interval cez polnoc:
#   now ≥ from OR now < to
#
# Ak:
#   from = "00:00"
#   to   = "24:00"
# → pravidlo platí 24 hodín denne


# ============================================================
# 9. HYSTERÉZIA
# ============================================================
# Relé sa zapne keď:
#   min ≤ hodnota ≤ max
#
# Relé sa vypne keď:
#   hodnota < (min - hyst)
#   alebo
#   hodnota > (max + hyst)
#
# Hysterézia zabraňuje kmitaniu relé.


# ============================================================
# 10. PWM KONFIGURÁCIA
# ============================================================
# pwm:
#   period:
#     default: 6000
#     min: 100
#     max: 10000
#     step: 100
#     unit: ms
#
#   duty:
#     default: 50
#     min: 0
#     max: 100
#     step: 1
#     unit: %
#
# PWM je aktívne len ak r1 = 1.


# ============================================================
# 11. PID KONFIGURÁCIA
# ============================================================
# pid:
#   t_set:
#     default: 1.0
#     min: 0.0
#     max: 100.0
#     step: 0.1
#
#   t_full:
#     default: 0.1
#     min: 0.0
#     max: 10.0
#     step: 0.01
#
#   t_move:
#     default: 0.01
#     min: 0.0
#     max: 10.0
#     step: 0.01
#
# PID je aktívne len ak r2 = 1.


# ============================================================
# 12. PRODUKČNÉ ZÁSADY
# ============================================================
# • Žiadna extrapolácia 4–20 mA
# • Všetky rule majú časový blok
# • Hysterézia je povinná
# • r1 a r2 sú fixné systémové relé
# • YAML nemení bezpečnostnú logiku
# • Systém nesmie generovať fyzikálne nemožné hodnoty
#
# ============================================================
# KONIEC DOKUMENTÁCIE
