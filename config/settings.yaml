modbus: 
  method: rtu
  #port: /dev/ttyUSB0
  port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
  baudrate: 9600
  parity: N
  stopbits: 1
  timeout_sec: 0.55
  # Spoločná perióda jedného poll cyklu (rovnaký timestamp pre všetky zariadenia).
  poll_period_s: 5

  slaves:
    temperature_slave_id: 2
    current_slave_id: 3

  registers:
    temperature:
      function: holding_registers
      address: 2
      count: 8
      scale: 0.1
      signed: true

    current_loop:
      function: holding_registers
      address: 96      # ⚠ toto môže byť 8, 16 alebo iné – podľa manuálu
      count: 8
      scale: 0.001
      signed: false
database:
  host: 127.0.0.1
  port: 3306
  user: dbapp
  password: admin
  name: ejector

# conversion robí CurrentLoopDevice — samostatný converter vypnutý (inak duplicitné riadky)
features:
  converter: false

hmi:
  refresh_ms: 2000

#
# ------------------------
# KONVERZNÉ KANÁLY
# ------------------------
# Dočasné aliasy = názov kanála (zapojenie ešte nie je definitívne).
# Neskôr nahraď name popisným textom, napr. "Teplota generátora".
channels:

  # --- Teploty ---
  t1: { name: "t_evap_in", unit: "°C" }
  t2: { name: "t_gen_out", unit: "°C" }
  t3: { name: "t_gen_in", unit: "°C" }
  t4: { name: "t_control", unit: "°C" }
  t5: { name: "t_cond_out", unit: "°C" }
  t6: { name: "t_cond_in", unit: "°C" }
  t7: { name: "t_evap_out", unit: "°C" }
  t8: { name: "NA", unit: "°C" }

  # --- Tlaky (z i1–i8 cez conversion) ---
  p1: { name: "NA", unit: "kPa" }
  p2: { name: "NA", unit: "kPa" }
  p3: { name: "NA", unit: "kPa" }
  p4: { name: "NA", unit: "kPa" }
  p5: { name: "NA", unit: "kPa" }
  p6: { name: "p_gen_prim", unit: "kPa (0-1500)" }
  p8: { name: "p_cond_prim", unit: "kPa (0-400)" }
  p7: { name: "p_evap_prim", unit: "kPa (0-220)" }


  # --- Prúdy 4–20 mA ---
  i1: { name: "NA", unit: "mA" }
  i2: { name: "NA", unit: "mA" }
  i3: { name: "NA", unit: "mA" }
  i4: { name: "NA", unit: "mA" }
  i5: { name: "NA", unit: "mA" }
  i6: { name: "p_gen_prim", unit: "mA (4-20)" }
  i7: { name: "p_evap_prim", unit: "mA (4-20)" }
  i8: { name: "p_cond_prim", unit: "mA (4-20)" }

conversion:
  interval_sec: 1
  # a = kPa pri 4 mA, b = kPa pri 20 mA
  # p = a + (i - 4) * (b - a) / 16
  channels:
    p1: { source: i1, a: 4.0, b: 20.0 }
    p2: { source: i2, a: 4.0, b: 20.0 }
    p3: { source: i3, a: 4.0, b: 20.0 }
    p4: { source: i4, a: 4.0, b: 20.0 }
    p5: { source: i5, a: 4.0, b: 20.0 }
    p6: { source: i6, a: 0, b: 1500.0 }
    p7: { source: i7, a: 0, b: 220.0 }
    p8: { source: i8, a: 0, b: 400.0 } 

# INVT GD20-EU na spoločnom Modbus RTU masteri.
# Setpoint ide cez Modbus 0x2002. Spätná väzba PID je vlastný analógový vstup meniča, nie P6.
invt_gd20:
  enabled: true
  slave_id: 100

  polling:
    # História GD20. Čítanie ide v cykle modbus.poll_period_s, nie vlastným intervalom.
    history_interval_s: 30

  pressure:
    unit: "kPa"
    min_kpa: 0
    max_kpa: 1500
    signal_min_ma: 4
    signal_max_ma: 20
    feedback_input: "AI2"
    feedback_min_percent: 0
    feedback_max_percent: 100
    # Prúdový AI GD20 reportuje v 0x300C/0x300D ako ekvivalent 0–10 V pre 0–20 mA.
    # V = raw * scale, mA = V / 10 * 20, potom 4–20 mA -> min_kpa..max_kpa.
    ai_report_min_v: 0
    ai_report_max_v: 10
    ai_report_min_ma: 0
    ai_report_max_ma: 20

  pid_defaults:
    # GD20 používa Kp, Ti, Td. Factory defaults podľa manuálu GD20-EU.
    # Pri štarte sa do meniča nezapisujú, aktuálny stav VFD má prednosť.
    kp: 1.00
    ti_s: 0.10
    td_s: 0.00

  commands:

    control:
      alias: "control_command"
      address: 0x2000
      access: "write"
      values:
        run_forward: 0x0001
        run_reverse: 0x0002
        stop: 0x0005
        coast_stop: 0x0006
        fault_reset: 0x0007

    pid_reference:
      alias: "pid_reference_command"
      address: 0x2002
      access: "read_write"
      raw_min: 0
      raw_max: 1000
      scale: 0.1
      unit: "%"
      engineering_unit: "kPa"
      engineering_min: 0
      engineering_max: 1500

    pid_feedback_command:
      alias: "pid_feedback_command"
      address: 0x2003
      access: "read_write"
      raw_min: 0
      raw_max: 1000
      scale: 0.1
      unit: "%"
      enabled: false

  monitoring:

    running_frequency:
      alias: "frequency_actual_hz"
      address: 0x3000
      access: "read"
      scale: 0.01
      unit: "Hz"

    set_frequency:
      alias: "frequency_set_hz"
      address: 0x3001
      access: "read"
      scale: 0.01
      unit: "Hz"

    dc_bus_voltage:
      alias: "dc_bus_voltage_v"
      address: 0x3002
      access: "read"
      scale: 0.1
      unit: "V"

    output_voltage:
      alias: "output_voltage_v"
      address: 0x3003
      access: "read"
      scale: 1.0
      unit: "V"

    output_current:
      alias: "output_current_a"
      address: 0x3004
      access: "read"
      scale: 0.1
      unit: "A"

    motor_speed:
      alias: "motor_speed_rpm"
      address: 0x3005
      access: "read"
      scale: 1
      unit: "rpm"

    output_power:
      alias: "output_power_percent"
      address: 0x3006
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"

    output_torque:
      alias: "output_torque_percent"
      address: 0x3007
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"

    pid_setting:
      alias: "pid_setpoint_percent"
      address: 0x3008
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"
      engineering_alias: "pid_setpoint_kpa"
      engineering_unit: "kPa"

    pid_feedback:
      alias: "pid_feedback_percent"
      address: 0x3009
      access: "read"
      signed: true
      scale: 0.1
      unit: "%"
      engineering_alias: "pid_feedback_kpa"
      engineering_unit: "kPa"

    digital_input_state:
      alias: "digital_input_state"
      address: 0x300A
      access: "read"
      scale: 1

    ai1:
      alias: "ai1_value"
      address: 0x300C
      access: "read"
      scale: 0.01

    ai2:
      alias: "ai2_value"
      address: 0x300D
      access: "read"
      scale: 0.01
      unit: "V"

    fault_code:
      alias: "fault_code"
      address: 0x5000
      access: "read"
      scale: 1

  parameters:

    run_command_source:
      alias: "run_command_source"
      parameter: "P00.01"
      address: 0x0001
      access: "read_write"
      required_value: 2

    max_frequency:
      alias: "max_frequency_hz"
      parameter: "P00.03"
      address: 0x0003
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    upper_frequency_limit:
      alias: "upper_frequency_limit_hz"
      parameter: "P00.04"
      address: 0x0004
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    lower_frequency_limit:
      alias: "lower_frequency_limit_hz"
      parameter: "P00.05"
      address: 0x0005
      access: "read_write"
      scale: 0.01
      unit: "Hz"

    frequency_source_a:
      alias: "frequency_source_a"
      parameter: "P00.06"
      address: 0x0006
      access: "read_write"
      required_value: 7

    acceleration_time:
      alias: "acceleration_time_s"
      parameter: "P00.11"
      address: 0x000B
      access: "read_write"
      scale: 0.1
      unit: "s"

    deceleration_time:
      alias: "deceleration_time_s"
      parameter: "P00.12"
      address: 0x000C
      access: "read_write"
      scale: 0.1
      unit: "s"

    pid_reference_source:
      alias: "pid_reference_source"
      parameter: "P09.00"
      address: 0x0900
      access: "read_write"
      required_value: 6

    pid_feedback_source:
      alias: "pid_feedback_source"
      parameter: "P09.02"
      address: 0x0902
      access: "read_write"
      required_value: 1

    pid_direction:
      alias: "pid_direction"
      parameter: "P09.03"
      address: 0x0903
      access: "read_write"

    pid_kp:
      alias: "pid_kp"
      parameter: "P09.04"
      address: 0x0904
      access: "read_write"
      scale: 0.01
      min: 0.00
      max: 100.00
      default: 1.00

    pid_ti:
      alias: "pid_ti_s"
      parameter: "P09.05"
      address: 0x0905
      access: "read_write"
      scale: 0.01
      unit: "s"
      min: 0.00
      max: 10.00
      default: 0.10

    pid_td:
      alias: "pid_td_s"
      parameter: "P09.06"
      address: 0x0906
      access: "read_write"
      scale: 0.01
      unit: "s"
      min: 0.00
      max: 10.00
      default: 0.00

    modbus_address:
      alias: "modbus_slave_id"
      parameter: "P14.00"
      address: 0x0E00
      access: "read_write"

    modbus_baudrate:
      alias: "modbus_baudrate_code"
      parameter: "P14.01"
      address: 0x0E01
      access: "read_write"
      required_value: 3

    modbus_format:
      alias: "modbus_format_code"
      parameter: "P14.02"
      address: 0x0E02
      access: "read_write"
      required_value: 0

    communication_timeout:
      alias: "communication_timeout_s"
      parameter: "P14.04"
      address: 0x0E04
      access: "read_write"
      scale: 0.1
      unit: "s"

# ============================================================
# PLC APLIKÁCIA – KOMPLETNÁ DOKUMENTÁCIA KONFIGURÁCIE
# ============================================================


# ============================================================
# 1. ARCHITEKTÚRA SYSTÉMU
# ============================================================
# Systém pozostáva z:
# • Modbus RTU komunikácie
# • Databázy (MariaDB)
# • Konverzie 4–20 mA → fyzikálne veličiny
# • Relay rule engine s časovými pravidlami
# • PWM riadenia
# • PID regulátora
# • Web aplikácie (app.py)
#
# Bezpečnostná logika (enable väzby) je pevne definovaná v kóde.
# YAML slúži iba na konfiguráciu.


# ============================================================
# 2. MODBUS KONFIGURÁCIA
# ============================================================
# modbus:
#   method: rtu
#   port: /dev/serial/by-id/...
#   baudrate: 19200
#   parity: N
#   stopbits: 1
#   timeout_sec: 1
#
# Slaves:
#   temperature_slave_id: 2
#   current_slave_id: 3
#   opta_slave_id: 1
#
# Register map:
# temperature:
#   function: holding_registers
#   address: 2
#   count: 8
#   signed: true
#
# current_loop:
#   function: holding_registers
#   address: 96
#   count: 8
#   signed: false
#
# Význam:
# • function = typ Modbus funkcie
# • address = počiatočná adresa
# • count = počet registrov
# • signed = či je hodnota so znamienkom


# ============================================================
# 3. KONVERZNÉ KANÁLY (4–20 mA)
# ============================================================
# Prúd sa ukladá do databázy už v mA.
# Príklad:
#   4000 → 4.000 mA
#
# scale sa nepoužíva.
#
# Definícia:
#   p1: { source: i1, a: 0.0, b: 100000.0 }
#
# a = hodnota pri 4 mA
# b = hodnota pri 20 mA
#
# Extrapolácia NIE JE POVOLENÁ.
#
# Clampovanie:
#   ak i < 4.0  → i = 4.0
#   ak i > 20.0 → i = 20.0
#
# Výpočet:
#   p = a + (i - 4.0) * (b - a) / 16.0
#
# 16 = (20 - 4)
#
# Systém nikdy negeneruje hodnoty mimo fyzikálneho rozsahu.


# ============================================================
# 4. RELAY SEKČIA – ZÁKLADY
# ============================================================
# relay:
#   count: 8
#   default_state: 0
#
# names:
#   r1: "Enable PWM (FIXED)"
#   r2: "Enable PID (FIXED)"
#   r3: "Valve 1"
#   r4: "Heater"
#   r5: "Spare 1"
#   r6: "Spare 2"
#   r7: "Spare 3"
#   r8: "Spare 4"
#
# count = počet relé
# default_state = stav po štarte (0 vypnuté, 1 zapnuté)


# ============================================================
# 5. FIXNÉ RELÉ – ENABLE MAP
# ============================================================
# r1 = ENABLE PWM
# r2 = ENABLE PID
#
# Tieto väzby sú pevne definované v kóde.
# YAML ich nesmie meniť.
#
# Ak:
#   r1 = 0 → PWM je blokované
#   r2 = 0 → PID je blokované
#
# Aj keď ostatné podmienky platia.


# ============================================================
# 6. RELAY – MODE A LOGIC
# ============================================================
# mode:
#   manual → riadi obsluha
#   auto   → riadi rule engine
#
# logic:
#   OR  → stačí splnenie jedného rule
#   AND → musia byť splnené všetky rule


# ============================================================
# 7. RELAY – PRAVIDLÁ (RULES)
# ============================================================
# Štruktúra:
#
# rules:
#   - time:
#       from: "HH:MM"
#       to:   "HH:MM"
#     conditions:
#       - { source: X, min: A, max: B, hyst: H }
#
# Každé rule MUSÍ mať časový blok.


# ============================================================
# 8. ČASOVÉ OBMEDZENIE
# ============================================================
# Formát času:
#   HH:MM (24 hodinový formát)
#   vždy dvojmiestne (06:00, nie 6:00)
#
# Príklady:
#   06:00 → 18:00
#   22:00 → 04:00 (cez polnoc)
#   00:00 → 24:00 (celý deň)
#
# 24:00 = 1440 minút od polnoci
#
# Vyhodnotenie:
#   minúty = HH * 60 + MM
#
# Interval bez polnoci:
#   from ≤ now < to
#
# Interval cez polnoc:
#   now ≥ from OR now < to
#
# Ak:
#   from = "00:00"
#   to   = "24:00"
# → pravidlo platí 24 hodín denne


# ============================================================
# 9. HYSTERÉZIA
# ============================================================
# Relé sa zapne keď:
#   min ≤ hodnota ≤ max
#
# Relé sa vypne keď:
#   hodnota < (min - hyst)
#   alebo
#   hodnota > (max + hyst)
#
# Hysterézia zabraňuje kmitaniu relé.


# ============================================================
# 10. PWM KONFIGURÁCIA
# ============================================================
# pwm:
#   period:
#     default: 6000
#     min: 100
#     max: 10000
#     step: 100
#     unit: ms
#
#   duty:
#     default: 50
#     min: 0
#     max: 100
#     step: 1
#     unit: %
#
# PWM je aktívne len ak r1 = 1.


# ============================================================
# 11. LEGACY / OPTA PID – NETÝKA SA INVT GD20
# ============================================================
# pid:
#   t_set:
#     default: 1.0
#     min: 0.0
#     max: 100.0
#     step: 0.1
#
#   t_full:
#     default: 0.1
#     min: 0.0
#     max: 10.0
#     step: 0.01
#
#   t_move:
#     default: 0.01
#     min: 0.0
#     max: 10.0
#     step: 0.01
#
# PID je aktívne len ak r2 = 1.


# ============================================================
# 12. PRODUKČNÉ ZÁSADY
# ============================================================
# • Žiadna extrapolácia 4–20 mA
# • Všetky rule majú časový blok
# • Hysterézia je povinná
# • r1 a r2 sú fixné systémové relé
# • YAML nemení bezpečnostnú logiku
# • Systém nesmie generovať fyzikálne nemožné hodnoty
#
# ============================================================
# KONIEC DOKUMENTÁCIE
# ============================================================#test
#test
#test
