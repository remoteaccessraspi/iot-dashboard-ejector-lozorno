modbus: 
  method: rtu
  #port: /dev/ttyUSB0
  port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG03G8OQ-if00-port0
  baudrate: 9600
  parity: N
  stopbits: 1
  timeout_sec: 0.55
  # Spoločná perióda jedného poll cyklu (rovnaký timestamp pre všetky zariadenia).
  poll_period_s: 5


# Master, HMI a converter sa pripájajú sem (RAM inštancia).
# user a password sú v config/secrets.yaml, ktorý nie je verzovaný.
# Vzor je v config/secrets.yaml.example. Prepísať ich vie aj prostredie
# cez EJECTOR_DB_USER a EJECTOR_DB_PASSWORD.
database:
  host: 127.0.0.1
  port: 3307
  name: ejector

# RAM inštancia pre archive_sync. Musí ukazovať na to isté ako database.
database_hot:
  host: 127.0.0.1
  port: 3307
  name: ejector

# Databáza na SD karte. Sync sem raz za interval vloží nové riadky histórie.
# DBeaver: port 3306, používateľ dbeaver, heslo v config/secrets.yaml. Len čítanie.
database_archive:
  host: 127.0.0.1
  port: 3306
  name: ejector

archive_sync:
  interval_s: 200
  batch_rows: 5000
  # Master píše do RAM. Stav sa dávkou vracia na kartu.
  sync_state: true
  hot_retention_hours: 24
  archive_retention_days: 90
  purge_archive: true

# conversion robí CK-7082E_8CH — samostatný converter vypnutý (inak duplicitné riadky)
features:
  converter: false

hmi:
  refresh_ms: 2000
  # Po tejto nečinnosti sa servis vráti na hlavnú kartu.
  service_idle_min: 30

# Alarm po troch poll cykloch bez odpovede. Slučka mimo 3.5–21 mA
# je warning, kým menič stojí, a alarm, kým beží.
alarms:
  comm_fail_cycles: 3
  loop_low_ma: 3.5
  loop_high_ma: 21.0
  loop_channels: [6, 7, 8]
  loop_max_age_s: 10
  # Čerstvosť teploty pre štart a teplotné alarmy. Staršia vzorka sa neberie.
  ready_max_age_s: 10
  # Medzera medzi vzorkami, ktorá ešte nezlomí hold_s (jeden vynechaný poll pri 5 s).
  ready_max_gap_s: 15
  # Čerstvosť vzorky meniča pri rozhodovaní o kavitácii.
  cavitation_max_age_s: 15
  # Ako ďaleko do histórie hľadať, či AI2 už dosiahlo cavitation.min_kpa.
  cavitation_arm_lookback_s: 10800
